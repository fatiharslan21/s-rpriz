<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bize Dair</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #050505; /* Tam siyah değil, çok koyu lüks siyah */
            color: #f0f0f0;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Playfair Display', serif; /* Klas font */
            overflow: hidden;
            cursor: pointer; /* Tıklanabilir hissi ver */
            user-select: none; /* Yazı seçilmese daha şık durur */
        }

        #content {
            text-align: center;
            max-width: 800px;
            padding: 0 20px;
            transition: opacity 1.5s ease-in-out, transform 1.5s ease-out;
            opacity: 0; /* Başlangıçta görünmez */
            transform: translateY(20px); /* Hafif aşağıdan yukarı çıkış efekti */
        }

        .visible {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 400;
            line-height: 1.4;
            letter-spacing: 1px;
        }

        /* Mobilde fontu biraz küçültelim */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
        }

        .hint {
            position: absolute;
            bottom: 30px;
            font-size: 0.8rem;
            opacity: 0.3;
            font-family: sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="content">
        <h1 id="text-display"></h1>
    </div>

    <div class="hint">İlerlemek için ekrana dokun</div>

    <script>
        // ŞOV VE KLASLIK İÇEREN METİNLER
        const messages = [
            "Herkes senin ördüğün duvarlara çarpıp geri döndü.",
            "Haklılar... O duvarlar çok yüksek.",
            "Geçmişin taşlarıyla örülmüş, soğuk ve sert.",
            "Ama gidenler bir şeyi kaçırdı...",
            "Ben o duvarlara bakınca 'engel' görmüyorum.",
            "Ben, o duvarların arkasında sakladığın <i>muazzam manzarayı</i> görüyorum.",
            "Korkman teferruat.",
            "Çünkü ben, o duvarları yıkmaya değil...",
            "Kapısında, sen hazır olana kadar beklemeye geldim.",
            "Ve inan bana...",
            "Hikayemiz başladığında, beklediğimiz her saniyeye değecek."
        ];

        let currentIndex = -1;
        const contentDiv = document.getElementById("content");
        const textDisplay = document.getElementById("text-display");
        let isAnimating = false;

        function showNextMessage() {
            if (isAnimating) return; // Animasyon bitmeden tıklamayı engelle
            isAnimating = true;

            // Önce yazıyı kaybet (Fade out)
            contentDiv.classList.remove("visible");

            setTimeout(() => {
                currentIndex++;

                if (currentIndex < messages.length) {
                    // Yeni yazıyı koy
                    textDisplay.innerHTML = messages[currentIndex];
                    // Yazıyı getir (Fade in)
                    contentDiv.classList.add("visible");
                    isAnimating = false;
                } else {
                    // SON EKRAN - Burada kalabilir veya başka bir şey yapabiliriz
                    textDisplay.innerHTML = "Sadece biz.";
                    contentDiv.classList.add("visible");
                }
            }, 1500); // 1.5 saniye bekle (yazının kaybolması için)
        }

        // İlk açılışta otomatik başlasın
        window.onload = () => {
            setTimeout(showNextMessage, 500);
        };

        // Ekrana tıklayınca/dokununca diğerine geç
        document.body.addEventListener("click", showNextMessage);

        // Boşluk tuşu ile de geçiş
        document.body.addEventListener("keydown", (e) => {
            if(e.code === "Space") showNextMessage();
        });

    </script>
</body>
</html>
